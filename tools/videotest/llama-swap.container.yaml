# llama-swap config for the containerised setup (unified-vulkan image).
# Host model dirs are mounted read-only at /models/<name>.
healthCheckTimeout: 180
models:
  lfm3-omni-base:
    cmd: llama-server -m /models/base/LFM3-Omni-2B-Q8_0.gguf --mmproj /models/base/mmproj-LFM3-Omni-2B-Q8_0.gguf -ngl 99 -c 4096 --host 127.0.0.1 --port ${PORT}
    proxy: http://127.0.0.1:${PORT}
    ttl: 300
  lfm3-omni-rp:
    cmd: llama-server -m /models/rp/LFM3-Omni-2B-RP-Q8_0.gguf --mmproj /models/base/mmproj-LFM3-Omni-2B-Q8_0.gguf -ngl 99 -c 4096 --host 127.0.0.1 --port ${PORT}
    proxy: http://127.0.0.1:${PORT}
    ttl: 300
